<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furniture-Moving Rehearsal</title>
  <style>
    :root {
      --ink: #1f2328; --muted: #5f6670; --line: #d9dce1; --panel: rgba(255, 255, 255, 0.92); --accent: #2f6fde;
      --ok: #1f8a4c; --warn: #b5651d; --wood: #b8864b;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #eef0f2; }
    #view { position: fixed; inset: 0; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    header.panel { top: 12px; left: 12px; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 15px; margin: 0 6px 0 0; }
    .tabs button { font: inherit; border: 1px solid var(--line); background: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .tabs button.on { border-color: var(--accent); color: var(--accent); }
    aside.panel { top: 12px; right: 12px; width: 340px; max-height: calc(100% - 84px); overflow: auto; font-size: 13px; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
    aside h2:first-child { margin-top: 0; }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 2px 8px; }
    .kv span:nth-child(odd) { color: var(--muted); }
    ol.phases { list-style: none; margin: 0; padding: 0; }
    ol.phases li { display: flex; justify-content: space-between; padding: 1px 6px; border-radius: 4px; color: var(--muted); }
    ol.phases li.done { color: var(--ink); }
    ol.phases li.now { background: #e8f0fd; color: var(--ink); font-weight: 600; }
    ol.phases small { font-weight: 400; color: var(--muted); }
    .meta { border-left: 3px solid var(--accent); padding: 8px 10px; background: #f5f8fe; border-radius: 4px; }
    .meta[hidden] { display: none; }
    .meta .who { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
    .meta .who button { font: inherit; font-size: 12px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; white-space: nowrap; flex-shrink: 0; }
    .pending { color: var(--muted); font-size: 12px; }
    .meta p { margin: 6px 0 0; }
    .result.ok { color: var(--ok); } .result.bad { color: var(--warn); }
    figure.panel { left: 12px; bottom: 76px; width: 260px; margin: 0; padding: 8px; }
    figure img { width: 100%; display: block; border-radius: 4px; }
    figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
    footer.panel { left: 12px; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
    footer button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; min-width: 64px; }
    #scrub { flex: 1; }
    #time, #phase { color: var(--muted); font-variant-numeric: tabular-nums; }
    #phase { min-width: 170px; color: var(--ink); }
    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--muted); }
    .tabs .try { border-style: dashed; }
    #plan-panel label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; margin: 3px 0; }
    #plan-panel input { font: inherit; width: 100%; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; }
    #plan-panel .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    #plan-panel button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    #plan-panel button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    #plan-panel button:disabled { opacity: .45; cursor: default; }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
    .bad-text { color: var(--warn); } .ok-text { color: var(--ok); }
    #progress { position: fixed; left: 50%; top: 86px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
    @media (max-width: 900px) { figure.panel { display: none; } aside.panel { width: 260px; } }
  </style>
  <script type="importmap">
    {"imports": {"three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="status">Loading…</div>
  <header class="panel">
    <h1>Furniture-Moving Rehearsal</h1>
    <div class="tabs" id="tabs"></div>
  </header>
  <aside class="panel">
    <div id="plan-panel" hidden>
      <h2>Your move</h2>
      <p class="hint" id="plan-hint">Click the furniture you want to move.</p>
      <div id="plan-item" hidden>
        <div class="kv" id="plan-meta"></div>
        <h2>Your correction</h2>
        <label>Width (m)<input id="fix-w" type="number" step="0.01" min="0.05"></label>
        <label>Depth (m)<input id="fix-d" type="number" step="0.01" min="0.05"></label>
        <label>Height (m)<input id="fix-h" type="number" step="0.01" min="0.05"></label>
        <label>Mass (kg)<input id="fix-m" type="number" step="0.5" min="0.5"></label>
        <h2>Destination</h2>
        <p class="hint" id="dest-hint">Click the floor where it should go.</p>
        <div class="row"><button id="rot-l" type="button">⟲ 15°</button><button id="rot-r" type="button">⟳ 15°</button></div>
        <div class="row"><button id="check" type="button" disabled>Check with Meta</button>
          <button id="rehearse" class="primary" type="button" disabled>Rehearse</button></div>
        <div id="plan-result"></div>
      </div>
    </div>
    <div id="replay-panel">
    <h2>Request</h2>
    <div class="kv" id="request"></div>
    <h2>Rehearsal</h2>
    <ol class="phases" id="phases"></ol>
    <div id="meta-box">
      <h2>Meta judgment</h2>
      <div class="pending" id="meta-pending">Muse Spark is consulted if the lift attempt fails.</div>
      <div class="meta" id="meta" hidden>
        <div class="who"><span id="meta-who"></span><button id="lang" type="button">한국어</button></div>
        <p id="meta-text"></p>
      </div>
    </div>
    <h2>Result</h2>
    <div class="kv" id="result"></div>
    </div>
  </aside>
  <div id="progress" hidden></div>
  <figure class="panel">
    <img id="photo" alt="Room photo the scene was built from">
    <figcaption>Room photo → scene by Meta SAM 3.1 + Muse Spark, corrected by the user. The motion is replayed from the Isaac Sim rehearsal.</figcaption>
  </figure>
  <footer class="panel">
    <button id="play" type="button">Pause</button>
    <span id="phase"></span>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Rehearsal time">
    <span id="time"></span>
    <button id="speed" type="button">1×</button>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
